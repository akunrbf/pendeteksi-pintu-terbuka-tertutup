<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Door Detection AI</title>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

h1{
    margin-bottom:5px;
}

button{
    padding:12px 25px;
    font-size:18px;
    background:#2563eb;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    margin:15px 0;
}

button:hover{
    background:#1d4ed8;
}

.status{
    width:90%;
    max-width:800px;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    background:#1e293b;
    border-radius:12px;
    margin-bottom:20px;
    border:2px solid #334155;
}

.container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.camera{
    position:relative;
    width:640px;
    height:480px;
}

video,canvas{
    width:100%;
    height:100%;
    border-radius:12px;
}

#overlay{
    position:absolute;
    left:0;
    top:0;
}

.log{
    width:300px;
    height:480px;
    overflow:auto;
    background:#111827;
    border-radius:12px;
    padding:10px;
    border:1px solid #334155;
}

.log-item{
    background:#1e293b;
    margin-bottom:10px;
    border-radius:10px;
    overflow:hidden;
}

.log-item img{
    width:100%;
}

.log-item p{
    font-size:12px;
    text-align:center;
    padding:5px;
}
</style>
</head>

<body>

<h1>🚪 Smart Door Detection AI</h1>

<button id="btn">START SYSTEM</button>

<div class="status" id="status">SYSTEM OFF</div>

<div class="container">

    <div class="camera">
        <video id="webcam" autoplay muted playsinline></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="log" id="log">
        <b style="display:block;text-align:center;margin-bottom:10px;">LOG</b>
    </div>

</div>

<canvas id="processor" width="640" height="640" style="display:none;"></canvas>

<script src="app.js"></script>

</body>
</html>
